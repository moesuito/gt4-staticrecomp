[package]
name = "gt4l-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GT4Recomp launcher platform code: SDL3 gamepad reader (the input layer the game uses), Recycle Bin deletes, job object and single instance, and the game process. No UI."

[dependencies]
gt4l-core.workspace = true
# SDL3 3.4.18, the version the game ships (decision: input layer on SDL3). Linked dynamically to SDL3.dll; see build.rs.
sdl3 = "0.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Globalization",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
