[[setting]]
id = "performance_mode"
label = "Performance Mode"
help = "Faster on weaker PCs. The game stops waiting for the graphics card to send images back: the car icons next to the gap time can come out blank and the loading screen picture may be missing. The night lights and the sun glare are turned off. Applies the next time you play."
page = "basic"
order = 6
control = "toggle"
section = "EmuCore/GS"
key = "HWDownloadMode"
type = "enum"
default = "accurate"
written = "always"
status = "ok"
choices = [
  { name = "accurate", ini = "0", status = "ok", label = "Off" },
  { name = "no-readbacks", ini = "2", status = "ok", label = "On" },
]
notes = "TASK-091 (release 1.2.1, owner 2026-10-22): replaces the Readbacks row (hw_download_mode, which had five values). A toggle over an enum: the first choice is Off, the second On. Off = Accurate = GSHardwareDownloadMode Enabled (0), the default; On = NoReadbacks (2) (pcsx2/Config.h:399-405). GSdx only: with CoreGS 1.1 the row is disabled in the launcher (model.rs GSDX_ONLY_ROWS). Migration: settings schema 5 to 6 (migrate.rs settings_5_to_6): a stored hw_download_mode other than accurate becomes On, the old key is dropped."

