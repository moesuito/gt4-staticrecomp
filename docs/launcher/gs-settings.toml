# GT4Recomp GS settings table (TASK-039, curated by TASK-049, docs/GS-SETTINGS.md).
#
# One row per setting. Read by scripts/gs_settings.py (validation, gt4-gs.ini generation, allow-list, reset) and by
# the launcher (TASK-019/043). Key names and value numbers are interface facts from the PCSX2 v2.8.2 sources
# (tag v2.8.2 = commit fd9d310c). Each note cites file:line at that commit. No code is copied; only names and numbers.
#
# Columns:
#   id          launcher identifier (lowercase; play_performance.py --gs-setting ID=VALUE uses it)
#   label       name shown to the owner
#   help        one-line help text
#   page        basic (the launcher's Graphics page), advanced (the Advanced section of the Graphics page), mods (a future mod manager, TASK-048;
#               shown on neither page), hidden (never shown: launcher or GT4 internal)
#   order       position within the page (1 is first); unique per page
#   control     slider (int range), toggle (bool), dropdown (enum), text (string), none (launcher-supplied, path)
#   section     INI section (empty for launcher-only rows)
#   key         INI key (empty for launcher-only rows, or when one row stands for several keys)
#   type        bool, int, float, enum, string, path (path = folder supplied by the launcher)
#   min, max    range for int and float
#   choices     enum values: { name = launcher name, ini = INI value, status = ok | resolved | pending-TASK-NNN,
#               label = optional display text, offered = false for a value that is settable (command line) but not
#               shown by the launcher, height = output height in lines (upscale presets only) }
#   accept_ini  enum rows: true when the INI value is also accepted as input (upscale: --gs-setting upscale=3 = 1080p)
#   default     GT4 default (launcher name for enums, "true" or "false" for bool, "" for an empty string)
#   written     always (in every generated INI), when-set (only when the value differs from the default),
#               launcher (only when the launcher supplies it), never (launcher-only, not in the INI)
#   status      ok        settable: key and values confirmed in the sources, and the owner accepts the row
#               resolved  key and values confirmed in the PCSX2 v2.8.2 sources; not settable until the owner
#                         checks it in the game (then it becomes ok)
#               pending-TASK-0NN  depends on another task
#   forced      optional, true on a hidden, always-written, ok row whose value is fixed: the writer always writes the
#               default and refuses any other value (Python and Rust writers alike); the launcher never shows it, and a
#               value stored by an earlier launcher is ignored (owner, 2026-10-21: aspect 16:9, PCSX2 OSD rows off)
#   env         launcher-only rows: the environment variable the launcher reads
#   notes       sources and open points
#
# Rule: a value is settable only when its row and its choice have status ok. Anything else is refused.
# The allow-list (gs-settings-allowlist.json) lists every row with a section and key, whatever its status.
# [[profile]] gt4-defaults: Reset to defaults = the default of every settable row (scripts/gs_settings.py
# reset_to_defaults()). render_ini(reset) reproduces the default gt4-gs.ini byte for byte.

schema_version = 1

[[profile]]
name = "gt4-defaults"
description = "Reset to defaults: GT4 default for every settable row (owner decisions, 2026-10-16)."

[[setting]]
id = "gs_engine"
label = "Renderer"
help = "Which renderer draws the game: GSdx, the PCSX2 GS renderer (GPL-3.0, downloaded). It is the only renderer the launcher starts (TASK-096)."
page = "basic"
order = 1
control = "dropdown"
section = ""
key = ""
type = "enum"
default = "pcsx2"
written = "never"
status = "ok"
env = "GT4_GS_ENGINE"
choices = [
  { name = "pcsx2", ini = "", status = "ok", label = "GSdx" },
]
notes = "Owner decision 2026-10-16 (TASK-049, item 1). Launcher-only: pcsx2 = gt4-gs.exe (`--mode pcsx2`). Owner decision 2026-10-22 (TASK-096, launcher 1.2.3): the CoreGS 1.1 choice is removed from the launcher; the built-in CoreGS 1.1 stays in the game executable unused by the launcher. The launcher reads GT4_GS_ENGINE (TASK-019/043); it is never written to gt4-gs.ini."

[[setting]]
id = "graphics_api"
label = "API"
help = "Automatic uses Vulkan when the graphics card supports Vulkan 1.2, otherwise Direct3D 11. Choose Vulkan, Direct3D 12 or Direct3D 11 to force one."
page = "basic"
order = 7
control = "dropdown"
section = "EmuCore/GS"
key = "Renderer"
type = "enum"
default = "auto"
written = "always"
status = "ok"
choices = [
  { name = "auto", ini = "14", status = "ok", label = "Automatic" },
  { name = "vulkan", ini = "14", status = "ok", label = "Vulkan" },
  { name = "d3d12", ini = "15", status = "ok", label = "Direct3D 12" },
  { name = "d3d11", ini = "3", status = "ok", label = "Direct3D 11" },
]
# TASK-103 (release 1.3.0): the id is graphics_api, not renderer, which is the launcher's engine setting (GSdx, CoreGS 2.0).
# OpenGL (GL 4.1 minimum, value 12) comes later: it needs a new gt4-gs build with its allow-list entry, then a choice here.
notes = "GSRendererType (pcsx2/Config.h:271-281): VK = 14, DX12 = 15, DX11 = 3. Loader pcsx2/Pcsx2Config.cpp:1044 (key Renderer). UI values pcsx2/ImGui/FullscreenUI_Settings.cpp:2774-2790. Owner decision 2026-10-23 (TASK-103): Vulkan and Direct3D 12 recommended, Direct3D 11 for older PCs; no OpenGL yet. The software renderer (SW = 13) is not offered; in the JIT-free gt4-gs 0.4.0 (TASK-042) it would run the C rasterizer (no software JIT), which is slow and not checked for GT4. TASK-108 (release 1.3.0): the default is auto, resolved by the launcher at every start to vulkan or d3d11 (gt4l-core gpu::plan) before the file is written; ini 14 is only the value an unresolved auto would write, which the launcher never does. Explicit vulkan, d3d12 and d3d11 values are kept."

[[setting]]
id = "upscale"
label = "Internal resolution"
help = "GS internal resolution multiplier, 1x to 12x. Set by the launcher from the Resolution and the Render scale (TASK-080 addendum); not a user setting."
page = "hidden"
order = 1
control = "dropdown"
section = "EmuCore/GS"
key = "upscale_multiplier"
type = "enum"
default = "1080p"
written = "always"
status = "ok"
accept_ini = true
choices = [
  { name = "480p", ini = "1", status = "ok", label = "480p (1x)", height = 480 },
  { name = "720p", ini = "2", status = "ok", label = "720p (2x)", height = 720 },
  { name = "1080p", ini = "3", status = "ok", label = "1080p (3x)", height = 1080 },
  { name = "1440p", ini = "4", status = "ok", label = "1440p (4x)", height = 1440 },
  { name = "4K", ini = "6", status = "ok", label = "4K (6x)", height = 2160 },
  { name = "8K", ini = "12", status = "ok", label = "8K (12x)", height = 4320 },
  { name = "5x", ini = "5", status = "ok", offered = false },
  { name = "7x", ini = "7", status = "ok", offered = false },
  { name = "8x", ini = "8", status = "ok", offered = false },
  { name = "9x", ini = "9", status = "ok", offered = false },
  { name = "10x", ini = "10", status = "ok", offered = false },
  { name = "11x", ini = "11", status = "ok", offered = false },
]
notes = "TASK-080 addendum (owner, 2026-10-21): no longer offered. The launcher writes it from the display plan (gt4l-core display::display_plan): k = ceil(max(W / 640, H / 448)) for the output size W x H, times the Render scale (50% to 200%), rounded to a whole multiplier (ties up) and clamped to 1..12; every value 1 to 12 is a choice of this row, so the allow-list is unchanged. Before: Owner decision 2026-10-16 (TASK-060/061/062 request): the launcher showed ONLY the six presets 480p (1x), 720p (2x), 1080p (3x), 1440p (4x), 4K (6x) and 8K (12x), with PCSX2's width-based mapping (640 x scale >= the target width: 1280, 1920, 2560, 3840, 7680). Default 1080p (3x) in the table; the launcher (TASK-019) will pick the smallest preset whose height is at least the monitor's VERTICAL resolution (unknown monitor: 1080p; scripts/gs_settings.py upscale_preset_for_monitor) and grey out presets above the GPU limit max(max texture size / 1280, 1) (upscale_presets_within_texture_limit). The other multipliers (5x, 7x to 11x) stay settable from the command line (play_performance.py --gs-scale N keeps 1 to 12) but are not offered. Range history: D.1, widened by owner decision 6 (2026-10-16). The loader accepts 1 to 12 (pcsx2/Pcsx2Config.cpp:1045). PCSX2 clamps any value above GSGetMaxUpscaleMultiplier = max(max texture size / 1280, 1) (pcsx2/GS/GS.cpp:677-681) with an OSD warning (pcsx2/GS/GS.cpp:225-240). A 16384-texel GPU allows 12x; 8192 allows 6x. READY carries no max-upscale field: ReadyPayload (3rdparty/gt4recomp-gs-stream/gs_stream_protocol.h:177-187) has only a reserved u32. Until gt4-gs reports the limit, the launcher offers 1 to 12 and PCSX2 clamps. ExtendedUpscalingMultipliers is NOT required up to 12x (see extended_upscale). --gs-scale N sets this row (GT4_GS_SCALE)."

